[workspace]
resolver = "2"
members = ["crates/crew-core", "crates/crew-cli", "crates/crew-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
debug = 1

# WebAssembly build for the web app: small and fast.
[profile.web]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
