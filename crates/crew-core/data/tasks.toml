# Task cards of The Crew: Mission Deep Sea.
#
# PLACEHOLDER DATA: texts and difficulty values come from the fan-made list on
# BoardGameGeek (thread 2631311), via remigerme/the-crew-solver. They will be
# replaced by transcriptions of the German edition. Entries marked
# `doubtful = true` disagree between sources or have unclear rules.
#
# Card selectors in `cards`: a card ("B4"), a whole suit ("P", "S"), or a
# value ("9" = the four colour cards of that value, no submarines).
#
# difficulty = [3 players, 4 players, 5 players]; rule cards have none.

