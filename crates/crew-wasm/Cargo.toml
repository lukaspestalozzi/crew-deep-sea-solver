[package]
name = "crew-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Deep Sea solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crew-core = { path = "../crew-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen CLI version used in the build.
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"
